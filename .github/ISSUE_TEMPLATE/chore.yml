name: Chore
description: Repo, docs, license, package metadata, or other non-feature work
title: "chore: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this for packaging, templates, license, or docs that are not a
        reader-facing feature.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is misaligned or missing?
